[tool.poetry]
name = "project"
version = "0.0.1"
description = "FastAPI project"
authors = []
readme = "README.md"
packages = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
# Сюди додавайте ваші залежності (fastapi, uvicorn тощо)

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.7.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--import-mode=importlib"
python_files = [
    "tests.py",
    "test_*.py",
]

# ==== Coverage (Аналіз покриття тестами) ====
[tool.coverage.run]
include = ["src/**"]  # Вказує на вашу папку з кодом src
omit = ["*/tests/*"]

# ==== mypy (Статична типізація, дуже корисна для FastAPI) ====
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

# ==== Ruff (Сучасний лінтер та форматир) ====
[tool.ruff]
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "venv",
    "migrations"
]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
# Ми залишили ваш список правил, але прибрали "DJ" (Django)
select = [
    "F",    # Pyflakes (реальні помилки, невикористані імпорти)
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ASYNC",# flake8-async
    "RUF",  # Ruff-specific rules
]
ignore = [
    "S101",    # Дозволяє використовувати assert (часто потрібен у тестах pytest)
    "RUF012",  # Вимикає сувору вимогу ClassVar для Pydantic-моделей FastAPI
    "SIM102",  # Дозволяє вкладені if, якщо так читається краще
    "UP038",   # Вимикає оптимізацію isinstance, яка може сповільнювати код
    "B008",    # Дозволяє Depends(...) у FastAPI аргументах
    "RUF001",  # Дозволяє кирилицю в рядках (принтах, текстах помилок)
    "RUF012",  # Дозволяє мутабельні дефолти в Pydantic/SQLAlchemy
    "E501",    # Довжина рядка (якщо розбиває форматер)
    "RUF003",   # Українські букви
    "RUF001",
    "RUF002",
    "RUF012",
    "UP042"
]
fixable = ["ALL"]
unfixable = []
extend-unsafe-fixes = ["UP038"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
